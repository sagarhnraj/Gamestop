spring.application.name=gamestopbackend

# Database Configuration (Aiven MySQL in production / Local MySQL in dev)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:e_commerce}?sslMode=${DB_SSL_MODE:PREFERRED}&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# JWT Authentication
jwt.secret=${JWT_SECRET:defaultsecretkeyminimum256bitsforhs256security}
jwt.expiration=86400000
jwt.refresh-expiration=604800000

# Razorpay Payment Gateway
razorpay.key.id=${RAZORPAY_KEY_ID:}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:}
razorpay.currency=INR

# Email / Mail Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Dynamic Port & Centralized CORS
server.port=${PORT:8080}
cors.allowed.origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
